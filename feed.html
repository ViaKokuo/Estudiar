<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Content metadata -->
  <title>Feed | Estudiar</title>
  <meta name="description" content="See what other students are studying on Estudiar and share your own study updates.">
  <meta name="author" content="Hisham">
  <meta name="keywords" content="study feed, study updates, students, Estudiar">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Estudiar styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app" data-page="feed">

  <!-- Navbar is injected here by js/layout.js -->
  <div id="app-navbar"></div>

  <main class="container pb-4">

    <header class="page-head">
      <h1>Study feed</h1>
      <p>See what everyone's working on, and share your own update.</p>
    </header>

    <div class="row g-3">

      <!-- ===== Posts ===== -->
      <section class="col-lg-8 order-2 order-lg-1" aria-label="Study posts">

        <!-- Filters -->
        <div class="mb-3">
          <label for="feed-search" class="visually-hidden">Search posts</label>
          <input type="search" class="form-control mb-3" id="feed-search" placeholder="Search posts or names">
          <div class="chip-row" id="chip-row" role="group" aria-label="Filter by subject"></div>
        </div>

        <p class="text-secondary small mb-3" id="feed-count" aria-live="polite"></p>
        <div id="post-list"></div>
      </section>

      <!-- ===== New post form ===== -->
      <aside class="col-lg-4 order-1 order-lg-2" aria-labelledby="new-post-title">
        <div class="panel">
          <h2 id="new-post-title">Share what you're studying</h2>

          <form id="post-form" novalidate>
            <div id="post-error" class="msg msg-error d-none" role="alert"></div>

            <div class="mb-3">
              <label for="post-subject" class="form-label">Subject</label>
              <select class="form-select" id="post-subject"></select>
            </div>
            <div class="mb-3">
              <label for="post-minutes" class="form-label">Minutes studied</label>
              <input type="number" class="form-control" id="post-minutes" min="1" max="600" placeholder="e.g. 45">
            </div>
            <div class="mb-3">
              <label for="post-text" class="form-label">What did you work on?</label>
              <textarea class="form-control" id="post-text" maxlength="200" placeholder="Keep it short, up to 200 characters"></textarea>
            </div>
            <button type="submit" class="btn btn-accent w-100">Post update</button>
          </form>
        </div>
      </aside>

    </div>
  </main>

  <!-- Footer is injected here by js/layout.js -->
  <div id="app-footer"></div>

  <!-- Scripts: auth.js before layout.js, data.js before feed.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/feed.js"></script>
</body>
</html>
