<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Content metadata -->
  <title>Members | Estudiar</title>
  <meta name="description" content="Browse Estudiar members, see their top subjects and weekly study hours, and who is studying right now.">
  <meta name="author" content="Hisham">
  <meta name="keywords" content="study members, study hours, students, Estudiar">

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Estudiar styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app" data-page="members">

  <!-- Navbar is injected here by js/layout.js -->
  <div id="app-navbar"></div>

  <main class="container pb-4">

    <header class="page-head">
      <h1>Members</h1>
      <p>Find study partners by subject, and see who's studying right now.</p>
    </header>

    <section class="panel" aria-label="Member list">

      <!-- Search + sort (the sort menu is how phones sort, since the table headers are hidden there) -->
      <div class="row g-2 mb-3">
        <div class="col-md-7">
          <label for="member-search" class="visually-hidden">Search members</label>
          <input type="search" class="form-control" id="member-search" placeholder="Search by name, course or subject">
        </div>
        <div class="col-md-5">
          <label for="member-sort" class="visually-hidden">Sort members</label>
          <select class="form-select" id="member-sort">
            <option value="hours-desc">Most hours this week</option>
            <option value="days-desc">Most active days</option>
            <option value="name-asc">Name, A to Z</option>
            <option value="studying-desc">Studying now first</option>
          </select>
        </div>
      </div>

      <p class="text-secondary small mb-2" id="member-count" aria-live="polite"></p>

      <table class="data-table">
        <caption class="visually-hidden">Estudiar members with their course, top subject, weekly hours, active days and status</caption>
        <thead>
          <tr>
            <th scope="col" data-key="name"><button type="button">Member</button></th>
            <th scope="col" data-key="course"><button type="button">Course</button></th>
            <th scope="col" data-key="subject"><button type="button">Top subject</button></th>
            <th scope="col" data-key="hours"><button type="button">Hours this week</button></th>
            <th scope="col" data-key="days"><button type="button">Active days</button></th>
            <th scope="col" data-key="studying"><button type="button">Status</button></th>
          </tr>
        </thead>
        <tbody id="member-body"></tbody>
      </table>

      <div id="member-empty" class="empty-state d-none">No members match your search.</div>
    </section>

  </main>

  <!-- Footer is injected here by js/layout.js -->
  <div id="app-footer"></div>

  <!-- Scripts: auth.js before layout.js, data.js before members.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/data.js"></script>
  <script src="js/members.js"></script>
</body>
</html>
